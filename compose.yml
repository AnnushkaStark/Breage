services:
  synapse-db:
    image: postgres:15-alpine
    container_name: synapse-db
    restart: always
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse_user
      POSTGRES_PASSWORD: synapse_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - matrix-net

  synapse-server:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: always
    ports:
      - "8008:8008"
    volumes:
      - ./synapse_config:/data
    depends_on:
      - synapse-db
    environment:
      - SYNAPSE_REPORT_STATS=no
    networks:
      - matrix-net


  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    restart: always
    ports:
      - "6379:6379"
    networks:
      - matrix-net


  bridge-app:
    build: .
    container_name: matrix-bridge-fastapi
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - synapse-server
      - redis-broker
    networks:
      - matrix-net

networks:
  matrix-net:
    driver: bridge
