services:
  synapse-db:
    image: postgres:15-alpine
    container_name: synapse-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: $SYNAPSE_PG_DB
      POSTGRES_USER: $SYNAPSE_PG_USER
      POSTGRES_PASSWORD: $SYNAPSE_PG_PASSWORD
    volumes:
      - synapse_postgres_data:/var/lib/postgresql/data
    networks:
      - matrix-net

  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    networks:
      - matrix-net

  synapse-server:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: always
    ports:
      - "8008:8008"
    volumes:
      - ./synapse_config:/data
    depends_on:
      - synapse-db
    environment:
      - SYNAPSE_REPORT_STATS=no
    networks:
      - matrix-net


  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    restart: always
    ports:
      - "6379:6379"
    networks:
      - matrix-net


  bridge-app:
    build: .
    container_name: matrix-bridge-fastapi
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - synapse-server
      - redis-broker
      - app-db
      - synapse-db
    networks:
      - matrix-net

volumes:
  synapse_postgres_data:
  app_postgres_data:

networks:
  matrix-net:
    driver: bridge
